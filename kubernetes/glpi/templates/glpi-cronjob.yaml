{{- if not (hasKey .Values.glpi.cronjob "enabled") | or .Values.glpi.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: glpi-cronjob
  namespace: {{ include "glpi.namespace" . }}
  labels:
    {{- include "glpi.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.glpi.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1 
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - image: {{ include "glpi.phpfpm.image" . }}
            imagePullPolicy: {{ .Values.glpi.phpfpm.image.pullPolicy }}
            name: base
            envFrom: 
            - configMapRef: 
                name: glpi-config
            - secretRef: 
                name: glpi-secret
            command: 
            - php
            - front/cron.php
            volumeMounts:
            - name: files 
              mountPath: /var/lib/glpi
            - name: marketplace
              mountPath: /var/www/html/marketplace
            - name: etc 
              mountPath: /etc/glpi
          volumes: 
          - name: etc
            persistentVolumeClaim:
              claimName: glpi-etc      
          - name: files
            persistentVolumeClaim:
              claimName: glpi-files
          - name: marketplace
            persistentVolumeClaim:
              claimName: glpi-marketplace
          restartPolicy: OnFailure
{{- end }}

