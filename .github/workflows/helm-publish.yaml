name: Helm Chart CI/CD

on:
  push:
    branches:
      - latest
      - main
    paths:
      - 'helm/**'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish chart to repository'
        required: false
        default: 'true'
        type: boolean
  release:
    types:
      - published

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CHART_DIR: helm

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint ${{ env.CHART_DIR }}

  package:
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      version: ${{ steps.chart_version.outputs.version }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add Helm repositories
        run: |
          helm repo add helmforge https://repo.helmforge.dev
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_DIR }}

      - name: Extract chart version
        id: chart_version
        run: |
          VERSION=$(sed -n -E 's/^version:[[:space:]]*"?([^"]+)"?/\1/p' "${{ env.CHART_DIR }}/Chart.yaml")
          echo "Chart version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create package directory
        run: |
          rm -rf .cr-release-packages
          mkdir -p .cr-release-packages

      - name: Package Helm chart
        run: |
          helm package ${{ env.CHART_DIR }} --destination .cr-release-packages
          echo "Packaged chart: glpi-${{ steps.chart_version.outputs.version }}.tgz"

      - name: Upload packaged chart as artifact
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart-package
          path: .cr-release-packages/glpi-${{ steps.chart_version.outputs.version }}.tgz
          retention-days: 30
          overwrite: true

  publish:
    runs-on: ubuntu-latest
    needs: package
    if: ${{ github.event_name == 'push' || github.event_name == 'release' || github.event.inputs.publish == 'true' }}
    steps:
      - name: Check out repository code with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Add Helm repositories
        run: |
          helm repo add helmforge https://repo.helmforge.dev
          helm repo update

      - name: Build chart dependencies
        run: helm dependency build ${{ env.CHART_DIR }}

      - name: Extract chart version
        id: chart_version
        run: |
          VERSION=$(sed -n -E 's/^version:[[:space:]]*"?([^"]+)"?/\1/p' "${{ env.CHART_DIR }}/Chart.yaml")
          echo "Publishing chart version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          charts_dir: .
          skip_existing: true
