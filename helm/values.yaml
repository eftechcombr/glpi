# Default values for GLPI Helm Chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Global configuration
global:
  # Namespace where GLPI will be deployed
  # If not set, the release namespace will be used
  # Leave empty to use Helm's release namespace
  namespace: ""
  # Enable to create the Namespace resource (cluster-scoped)
  # Set to true if your SA has cluster-wide permissions; leave false
  # for namespace-scoped RBAC (e.g., FluxCD multi-tenancy)
  createNamespace: false

# -- GLPI Application Configuration
glpi:
  # GLPI version to deploy
  version: "11.0.8"
  
  # GLPI default language (e.g., en_US, fr_FR, pt_BR)
  language: "en_US"
  
  # PHP-FPM container configuration
  phpfpm:
    # Container image settings
    image:
      # Image repository for PHP-FPM
      repository: eftechcombr/glpi
      # Image tag for PHP-FPM
      tag: php-fpm-11.0.8
      # Image pull policy
      pullPolicy: IfNotPresent
    
    # Number of PHP-FPM replicas.
    # Ignored (Kubernetes/HPA owns the field instead) when autoscaling.enabled is true.
    replicaCount: 1

    # Set container resources according to one common preset (allowed values: none, nano,
    # micro, small, medium, large, xlarge, 2xlarge). Only applied when `resources` below is
    # left empty ({}). In production, setting `resources` explicitly is recommended over
    # relying on a preset.
    resourcesPreset: "none"
    # -- Horizontal Pod Autoscaler
    # Remember the shared-storage caveat: php-fpm reads/writes GLPI_VAR_DIR (uploads,
    # sessions) on a PVC. Scaling beyond 1 replica requires that PVC to use a
    # ReadWriteMany-capable storageClass (NFS, CephFS, EFS, etc) - see
    # glpi.persistence.files.accessMode.
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      # Leave empty to omit that metric from the HPA entirely.
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: ""
    
    # Resource limits and requests for PHP-FPM container
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
    
    # Liveness probe configuration for PHP-FPM
    livenessProbe:
      # Enable or disable liveness probe
      enabled: true
      # TCP socket check on PHP-FPM port
      tcpSocket:
        port: 9000
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    
    # Readiness probe configuration for PHP-FPM
    readinessProbe:
      # Enable or disable readiness probe
      enabled: true
      # TCP socket check on PHP-FPM port
      tcpSocket:
        port: 9000
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

    # -- Pod Disruption Budget
    # Only meaningful when phpfpm.replicaCount > 1: with a single replica, a PDB
    # requiring minAvailable: 1 (or maxUnavailable: 0) will block voluntary node
    # drains/evictions entirely, since Kubernetes can never satisfy it. Defaults to
    # disabled for that reason; enable once you scale replicaCount up.
    pdb:
      enabled: false
      # Minimum number/percentage of pods that must remain available (e.g. 1 or "50%").
      # Leave empty to use maxUnavailable instead.
      minAvailable: ""
      # Maximum number/percentage of pods that may be unavailable (e.g. 1 or "50%").
      # Ignored if minAvailable is set.
      maxUnavailable: 1
  
  # Nginx container configuration
  nginx:
    # Container image settings
    image:
      # Image repository for Nginx
      repository: eftechcombr/glpi
      # Image tag for Nginx
      tag: nginx-11.0.8
      # Image pull policy
      pullPolicy: IfNotPresent
    
    # Number of Nginx replicas.
    # Ignored (Kubernetes/HPA owns the field instead) when autoscaling.enabled is true.
    replicaCount: 1

    # Set container resources according to one common preset (allowed values: none, nano,
    # micro, small, medium, large, xlarge, 2xlarge). Only applied when `resources` below is
    # left empty ({}).
    resourcesPreset: "none"
    # -- Horizontal Pod Autoscaler
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: ""
    
    # Resource limits and requests for Nginx container
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
    
    # Liveness probe configuration for Nginx
    livenessProbe:
      # Enable or disable liveness probe
      enabled: true
      # HTTP GET check on Nginx port
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    
    # Readiness probe configuration for Nginx
    readinessProbe:
      # Enable or disable readiness probe
      enabled: true
      # HTTP GET check on Nginx port
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3

    # -- Pod Disruption Budget
    # Only meaningful when nginx.replicaCount > 1 - see the equivalent note under
    # glpi.phpfpm.pdb.
    pdb:
      enabled: false
      minAvailable: ""
      maxUnavailable: 1
    
    # Nginx service configuration
    service:
      # Service type (ClusterIP, NodePort, LoadBalancer)
      type: ClusterIP
      # Service port exposed externally
      port: 80
      # Target port on the container
      targetPort: 8080
  
  # GLPI directory paths configuration
  paths:
    # Marketplace plugins directory
    marketplace: /var/www/html/marketplace
    # Variable data directory
    var: /var/lib/glpi
    # Configuration directory
    config: /etc/glpi/config
  
  # Persistent storage configuration for GLPI
  persistence:
    # Files volume (main GLPI data)
    files:
      # Enable persistent storage for files
      enabled: true
      # Storage class name (leave empty for default)
      storageClass: ""
      # Access mode for the volume
      accessMode: ReadWriteOnce
      # Size of the persistent volume
      size: 10Gi
    
    # Marketplace volume (plugins)
    marketplace:
      # Enable persistent storage for marketplace
      enabled: true
      # Storage class name (leave empty for default)
      storageClass: ""
      # Access mode for the volume
      accessMode: ReadWriteOnce
      # Size of the persistent volume
      size: 2Gi
    
    # Configuration volume
    etc:
      # Enable persistent storage for configuration
      enabled: true
      # Storage class name (leave empty for default)
      storageClass: ""
      # Access mode for the volume
      accessMode: ReadWriteOnce
      # Size of the persistent volume
      size: 50Mi
  
  # -- Job Configuration
  # Control which initialization jobs are deployed
  jobs:
    # Verify and create required GLPI directories
    verifyDir:
      enabled: true
    
    # Install GLPI database schema (for fresh installations)
    dbInstall:
      enabled: true
    
    # Upgrade GLPI database schema (for version upgrades)
    dbUpgrade:
      enabled: true
    
    # Configure GLPI database connection
    dbConfigure:
      enabled: true
    
    # Configure GLPI cache settings
    cacheConfigure:
      enabled: true
  
  # -- CronJob Configuration
  # Control the scheduled maintenance job
  cronjob:
    # Enable or disable the GLPI maintenance cronjob
    enabled: true
    # Schedule in cron format (default: every 2 minutes)
    schedule: "*/2 * * * *"

  # -- Files Backup Configuration
  # Periodically archives the files/marketplace/etc PVCs (uploads, documents, sessions,
  # marketplace plugins, GLPI config) to S3-compatible storage. Mirrors the naming and
  # implementation pattern of the helmforge/mariadb subchart's own backup.* (same uploader
  # image, same existingSecret convention) - use that subchart's backup.enabled for database
  # backups; this is the files-only counterpart, since GLPI's actual data lives on PVCs the
  # mariadb subchart has no knowledge of.
  backup:
    # -- Enable the files backup CronJob. Requires s3.endpoint and s3.bucket to be set.
    enabled: false
    # -- Backup schedule in Cron format
    schedule: "0 3 * * *"
    # -- Suspend backup execution
    suspend: false
    # -- CronJob concurrency policy
    concurrencyPolicy: Forbid
    # -- Successful job history retained by the CronJob
    successfulJobsHistoryLimit: 3
    # -- Failed job history retained by the CronJob
    failedJobsHistoryLimit: 3
    # -- Job backoff limit
    backoffLimit: 1
    # -- Prefix used in generated backup archive names
    archivePrefix: glpi
    # -- Resources applied to the backup (tar) and upload containers
    resources: {}
    images:
      # -- MinIO client image used to upload the archive to S3. Same image as the
      # helmforge/mariadb subchart's backup.images.uploader, for consistency.
      uploader:
        repository: docker.io/helmforge/mc
        tag: "1.0.0"
        pullPolicy: IfNotPresent
    # -- Which persistent volumes to include in the backup archive. Disable individually to
    # reduce archive size/backup time - e.g. skip `files` (usually the largest, holding
    # uploads/documents) if it is already covered by a separate volume-level snapshot policy
    # (CSI VolumeSnapshot, cloud disk snapshots, etc).
    volumes:
      files: true
      marketplace: true
      etc: true
    s3:
      # -- S3-compatible endpoint URL, for example: https://s3.amazonaws.com or https://minio.example.com
      endpoint: ""
      # -- Target bucket name
      bucket: ""
      # -- Optional key prefix inside the bucket
      prefix: glpi
      # -- Create the bucket automatically when it does not exist yet
      createBucketIfNotExists: true
      # -- Existing secret containing access-key and secret-key
      existingSecret: ""
      # -- Secret key name for the access key inside s3.existingSecret
      existingSecretAccessKeyKey: access-key
      # -- Secret key name for the secret key inside s3.existingSecret
      existingSecretSecretKeyKey: secret-key
      # -- Inline access key used when s3.existingSecret is not set
      accessKey: ""
      # -- Inline secret key used when s3.existingSecret is not set
      secretKey: ""

  # -- GLPI Pod Security Context
  # Security settings applied at the pod level
  podSecurityContext:
    # Set fsGroup to www-data (82) for file permissions
    fsGroup: 82

  # -- GLPI Container Security Context
  # Security settings applied at the container level (php-fpm, nginx, all init Jobs, cronjob)
  securityContext:
    # Run as non-root user
    runAsNonRoot: true
    # Run as www-data user (82)
    runAsUser: 82
    # Drop all capabilities
    capabilities:
      drop:
      - ALL
    # Mount the container's root filesystem as read-only. Verified against the actual
    # eftechcombr/glpi:php-fpm and :nginx images (docker run --read-only): php-fpm starts
    # cleanly with no extra writable paths; nginx needs /tmp writable (proxy_temp etc, used
    # by nginx-unprivileged's default config). When enabled, this chart mounts an emptyDir
    # at /tmp on every container that shares this securityContext (php-fpm, nginx, init
    # Jobs, cronjob) to cover both cases uniformly. GLPI's own data (uploads, sessions,
    # config, marketplace) already lives on PVCs, unaffected by this setting either way.
    readOnlyRootFilesystem: false

# -- MariaDB Subchart Configuration
# Database Configuration (deploys helmforge/mariadb subchart)
# Replaces the inline MariaDB StatefulSet. Uses the helmforge/mariadb chart.
# Service DNS: {release-name}-mariadb.{namespace}.svc.cluster.local:3306
mariadb:
  # Enable or disable MariaDB deployment
  # Set to false to use an external database
  enabled: true
  # MariaDB deployment mode: standalone (Deployment) or replication (StatefulSet + GTID)
  architecture: standalone

  # Container image settings
  image:
    # Image repository for MariaDB
    repository: docker.io/library/mariadb
    # Image tag for MariaDB
    tag: "12.3.2"
    # Image pull policy
    pullPolicy: IfNotPresent

  # Database authentication configuration
  auth:
    # Root password for MariaDB
    rootPassword: glpi
    # Database name for GLPI
    database: glpi
    # Database username for GLPI
    username: glpi
    # Database password for GLPI user
    password: glpi
    # -- Use a pre-existing Secret (Doppler / External Secrets / Vault / sealed-secrets, etc)
    # for MariaDB credentials instead of the plaintext values above. When set, leave
    # rootPassword/password empty - GLPI's own containers read the password directly from this
    # Secret (see glpi.mariadb.secretName in _helpers.tpl), so it stays in sync automatically.
    # existingSecret: ""
    # -- Key within existingSecret holding the application user password, if it differs from
    # the helmforge/mariadb subchart's default ("mariadb-user-password").
    # existingSecretUserPasswordKey: mariadb-user-password

  # Service configuration
  service:
    # Service port for database connections
    port: 3306

  # Standalone mode specific configuration
  standalone:
    # Persistent storage configuration for MariaDB
    persistence:
      # Enable persistent storage for database
      enabled: true
      # Storage class name (leave empty for default)
      storageClass: ""
      # Size of the persistent volume
      size: 10Gi
    # Resource limits and requests for MariaDB
    resources:
      limits:
        cpu: 1000m
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 256Mi

  # Init scripts executed on first boot (docker-entrypoint-initdb.d)
  initdb:
    scripts:
      grant-timezone.sql: |
        GRANT SELECT ON mysql.time_zone_name TO 'glpi'@'%';
        FLUSH PRIVILEGES;

  # -- MariaDB Pod Security Context
  # Security settings applied at the pod level
  podSecurityContext:
    fsGroup: 999

  # -- MariaDB Container Security Context
  # Security settings applied at the container level
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# -- Valkey Subchart Configuration
# Cache Configuration (deploys Valkey subchart)
# Replaces the inline Redis deployment. Uses the helmforge/valkey chart.
# Service DNS: {fullnameOverride}-valkey-client.{namespace}.svc.cluster.local:6379
valkey:
  # Enable or disable Valkey deployment for caching
  # Set to false if caching is not needed
  enabled: true
  # Valkey topology: standalone, replication, sentinel, or cluster
  architecture: standalone

  # Valkey container image settings
  image:
    # Image repository for Valkey
    repository: docker.io/valkey/valkey
    # Image tag for Valkey
    tag: "9.1.0"
    # Image pull policy
    pullPolicy: IfNotPresent

  # Authentication (disabled to match previous behavior)
  auth:
    enabled: false

  # Service configuration
  service:
    # Service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP
    # Service port for Valkey connections
    port: 6379

  # Standalone mode specific configuration
  standalone:
    # Persistence (disabled — Valkey serves as a cache, not a database)
    persistence:
      enabled: false

  # Resource limits and requests for Valkey
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # -- Valkey Pod Security Context
  podSecurityContext:
    fsGroup: 1001

  # -- Valkey Container Security Context
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

# -- Ingress Configuration
# Configure ingress to expose GLPI externally
ingress:
  # Enable or disable ingress
  enabled: false
  # Ingress class name (e.g., nginx, traefik, kong)
  className: ""
  # Annotations for the ingress resource
  # Example for nginx ingress controller:
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  #   nginx.ingress.kubernetes.io/proxy-body-size: "100m"
  annotations: {}
  # Ingress host configuration
  hosts:
    - host: glpi.example.local
      paths:
        - path: /
          pathType: Prefix
  # TLS configuration for HTTPS
  # Example:
  # tls:
  #   - secretName: glpi-tls
  #     hosts:
  #       - glpi.example.local
  tls: []

# -- Service Account Configuration
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Image Pull Secrets
# Secrets for pulling images from private registries
imagePullSecrets: []

# -- Name Overrides
# Override the chart name
nameOverride: ""
# Override the full name
fullnameOverride: ""

# -- Pod Annotations
# Annotations to add to GLPI pods
podAnnotations: {}

# -- Pod Labels
# Labels to add to GLPI pods
podLabels: {}

# -- Priority Class Name
# Assign a PriorityClass to all GLPI-owned pods (php-fpm, nginx, the init Jobs, and the
# cronjob). Useful to protect the init Jobs (dbInstall/dbConfigure/etc) from eviction or
# scheduling starvation under node pressure during install/upgrade, and/or to keep GLPI
# itself running preferentially over lower-priority workloads. Must reference a
# PriorityClass that already exists in the cluster (this chart does not create one).
# Example: "system-cluster-critical" or a custom PriorityClass name.
# To also prioritize the database/cache tier, set mariadb.priorityClassName and/or
# valkey.priorityClassName - both subcharts already support this independently.
priorityClassName: ""

# -- Node Selector
# Node labels for pod assignment
# Example:
# nodeSelector:
#   disktype: ssd
nodeSelector: {}

# -- Tolerations
# Tolerations for pod assignment
# Example:
# tolerations:
#   - key: "key1"
#     operator: "Equal"
#     value: "value1"
#     effect: "NoSchedule"
tolerations: []

# -- Affinity
# Affinity rules for pod assignment
# Example:
# affinity:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: kubernetes.io/hostname
#           operator: In
#           values:
#           - node1
affinity: {}

# -- External Database Configuration
# Used when mariadb.enabled is false
externalDatabase:
  # External database hostname or IP
  host: ""
  # External database port
  port: 3306
  # External database name
  database: ""
  # External database username
  username: ""
  # External database password
  password: ""

# -- External Cache Configuration
# Used when valkey.enabled is false
externalCache:
  # External Redis/Valkey hostname or IP
  host: ""
  # External Redis/Valkey port
  port: 6379
  # External Redis/Valkey password (leave empty if no auth)
  password: ""
  # Enable TLS for cache connection (rediss://)
  tls: false
