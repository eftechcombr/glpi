{{- include "glpi.externalDatabase.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: glpi-config
  namespace: {{ include "glpi.namespace" . }}
  labels:
    {{- include "glpi.labels" . | nindent 4 }}
data:
  GLPI_LANG: {{ .Values.glpi.language | quote }}
  VERSION: {{ .Values.glpi.version | quote }}
  GLPI_MARKETPLACE_DIR: {{ .Values.glpi.paths.marketplace }}
  GLPI_VAR_DIR: {{ .Values.glpi.paths.var }}
  GLPI_DOC_DIR: /var/www/html
  GLPI_CRON_DIR: {{ .Values.glpi.paths.var }}/_cron
  GLPI_DUMP_DIR: {{ .Values.glpi.paths.var }}/_dumps
  GLPI_GRAPH_DIR: {{ .Values.glpi.paths.var }}/_graphs
  GLPI_LOCK_DIR: {{ .Values.glpi.paths.var }}/_lock
  GLPI_LOG_DIR: {{ .Values.glpi.paths.var }}/_log
  GLPI_PICTURE_DIR: {{ .Values.glpi.paths.var }}/_pictures
  GLPI_PLUGIN_DOC_DIR: {{ .Values.glpi.paths.var }}/_plugins
  GLPI_RSS_DIR: {{ .Values.glpi.paths.var }}/_rss
  GLPI_SESSION_DIR: {{ .Values.glpi.paths.var }}/_sessions
  GLPI_TMP_DIR: {{ .Values.glpi.paths.var }}/_tmp
  GLPI_UPLOAD_DIR: {{ .Values.glpi.paths.var }}/_uploads
  GLPI_CACHE_DIR: {{ .Values.glpi.paths.var }}/_cache
  GLPI_CONFIG_DIR: {{ .Values.glpi.paths.config }}

  {{- if .Values.mariadb.enabled }}
  MARIADB_HOST: {{ printf "%s-mariadb.%s.svc.cluster.local" .Release.Name (include "glpi.namespace" .) | quote }}
  MARIADB_PORT: {{ .Values.mariadb.service.port | default "3306" | quote }}
  {{- else }}
  MARIADB_HOST: {{ .Values.externalDatabase.host | quote }}
  MARIADB_PORT: {{ .Values.externalDatabase.port | quote }}
  {{- end }}

  {{- if include "glpi.database.ssl.enabled" . }}
  {{- $ssl := dict }}
  {{- if and .Values.database .Values.database.ssl }}
    {{- $ssl = .Values.database.ssl }}
  {{- else if and .Values.externalDatabase .Values.externalDatabase.ssl }}
    {{- $ssl = .Values.externalDatabase.ssl }}
  {{- end }}
  {{- $certPath := $ssl.certPath | default "/etc/glpi/db-tls" }}
  {{- $hasSecret := or $ssl.existingSecret (or $ssl.caCert (or $ssl.clientCert $ssl.clientKey)) }}
  GLPI_DB_SSL: "true"
  {{- if $ssl.ca }}
  GLPI_DB_SSL_CA: {{ $ssl.ca | quote }}
  {{- else if and $ssl.caKey $ssl.existingConfigMap }}
  {{- $cmPath := $certPath }}
  {{- if $hasSecret }}{{ $cmPath = printf "%s-cm" $certPath }}{{ end }}
  GLPI_DB_SSL_CA: {{ printf "%s/%s" $cmPath $ssl.caKey | quote }}
  {{- else if and $ssl.caKey $hasSecret }}
  GLPI_DB_SSL_CA: {{ printf "%s/%s" $certPath $ssl.caKey | quote }}
  {{- end }}
  {{- if $ssl.cert }}
  GLPI_DB_SSL_CERT: {{ $ssl.cert | quote }}
  {{- else if and $ssl.certKey $hasSecret }}
  GLPI_DB_SSL_CERT: {{ printf "%s/%s" $certPath $ssl.certKey | quote }}
  {{- else if and $ssl.certKey $ssl.existingConfigMap }}
  {{- $cmPath := $certPath }}
  {{- if $hasSecret }}{{ $cmPath = printf "%s-cm" $certPath }}{{ end }}
  GLPI_DB_SSL_CERT: {{ printf "%s/%s" $cmPath $ssl.certKey | quote }}
  {{- end }}
  {{- if $ssl.key }}
  GLPI_DB_SSL_KEY: {{ $ssl.key | quote }}
  {{- else if and $ssl.keyKey $hasSecret }}
  GLPI_DB_SSL_KEY: {{ printf "%s/%s" $certPath $ssl.keyKey | quote }}
  {{- end }}
  {{- if $ssl.capath }}
  GLPI_DB_SSL_CAPATH: {{ $ssl.capath | quote }}
  {{- end }}
  {{- if $ssl.cipher }}
  GLPI_DB_SSL_CIPHER: {{ $ssl.cipher | quote }}
  {{- end }}
  {{- end }}

  {{- if .Values.valkey.enabled }}
  {{- $valkeyPort := .Values.valkey.service.port | default 6379 | toString }}
  CACHE_DSN: {{ printf "redis://%s-valkey-client:%s" .Release.Name $valkeyPort | quote }}
  {{- else if .Values.externalCache.host }}
  {{- $scheme := "redis" }}
  {{- if .Values.externalCache.tls }}{{ $scheme = "rediss" }}{{ end }}
  CACHE_DSN: {{ printf "%s://%s:%s" $scheme .Values.externalCache.host (.Values.externalCache.port | default 6379 | toString) | quote }}
  {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: {{ include "glpi.namespace" . }}
  labels:
    {{- include "glpi.labels" . | nindent 4 }}
    name: nginx-conf
data:
  default.conf: |-
    {{ tpl .Values.glpi.nginx.configTemplate . | nindent 4 }}
