{{- if include "glpi.database.ssl.enabled" . }}
{{- $ssl := dict -}}
{{- if and .Values.database .Values.database.ssl -}}
  {{- $ssl = .Values.database.ssl -}}
{{- else if and .Values.externalDatabase .Values.externalDatabase.ssl -}}
  {{- $ssl = .Values.externalDatabase.ssl -}}
{{- end -}}
{{- if and (not $ssl.existingSecret) (or $ssl.caCert $ssl.clientCert $ssl.clientKey) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "glpi.database.ssl.secretName" . }}
  namespace: {{ include "glpi.namespace" . }}
  labels:
    {{- include "glpi.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-tls
type: Opaque
stringData:
  {{- if $ssl.caCert }}
  {{ $ssl.caKey | default "ca.crt" }}: {{ $ssl.caCert | quote }}
  {{- end }}
  {{- if $ssl.clientCert }}
  {{ $ssl.certKey | default "tls.crt" }}: {{ $ssl.clientCert | quote }}
  {{- end }}
  {{- if $ssl.clientKey }}
  {{ $ssl.keyKey | default "tls.key" }}: {{ $ssl.clientKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
