apiVersion: v2
name: glpi
description: GLPI Helm Chart - IT Asset Management and Service Desk
type: application
version: 2.11.1
appVersion: "11.0.8"

dependencies:
  - name: valkey
    version: "2.0.2"
    repository: "https://repo.helmforge.dev"
    condition: valkey.enabled
  - name: mariadb
    version: "2.0.3"
    repository: "https://repo.helmforge.dev"
    condition: mariadb.enabled

# Artifact Hub Metadata
home: https://github.com/eftechcombr/glpi
icon: https://www.glpi-project.org/wp-content/uploads/2025/03/glpi-teclib-color-logo.svg
sources:
  - https://github.com/eftechcombr/glpi
  - https://github.com/glpi-project/glpi

maintainers:
  - name: eftechcombr
    email: contato@eftech.com.br
    url: https://github.com/eftechcombr

keywords:
  - glpi
  - itil
  - asset-management
  - service-desk
  - itsm

annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/language: en, pt-br
  artifacthub.io/license: GPL-3.0
  artifacthub.io/links: |
    - name: support
      url: https://github.com/eftechcombr/glpi/issues
  artifacthub.io/changes: |
    - kind: changed
      description: "Replace inline MariaDB StatefulSet with helmforge/mariadb subchart v2.0.3"
    - kind: changed
      description: "Update MariaDB image from mariadb:11.4 to mariadb:12.3.2"
    - kind: changed
      description: "MariaDB values restructured: resources/persistence under standalone.*, security UID 999"
    - kind: changed
      description: "Timezone grant moved from helm hook job to subchart initdb.scripts"
    - kind: changed
      description: "Service DNS changed to dynamic {release-name}-mariadb pattern"
